<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habits - Second Brain</title>
    <script>
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app-nav"></div>

    <main class="habits-page">
        <div class="tasks-toolbar">
            <h1 class="h4 mb-0">Habits</h1>
            <button class="btn btn-primary btn-sm" id="addHabitBtn">+ Add Habit</button>
        </div>

        <div id="habitsList"></div>
    </main>

    <div class="modal fade" id="habitModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="habitForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="habitModalTitle">Add Habit</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="habitId" />
                        <div class="mb-3">
                            <label class="form-label" for="habitTitle">Title</label>
                            <input type="text" class="form-control" id="habitTitle" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="habitTarget">Target per week</label>
                            <input type="number" class="form-control" id="habitTarget" min="1" max="7" value="7"
                                required />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                            data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/pages/habits.js"></script>
</body>

</html>
