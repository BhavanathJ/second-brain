<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes — Second Brain</title>
    <script>
        (function () {
            var pref = localStorage.getItem('theme') || 'system';
            var resolved = pref === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : pref;
            document.documentElement.setAttribute('data-theme', resolved);
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app-nav"></div>

    <main class="notes-page">
        <h1 class="h4 mb-3">Notes</h1>

        <div class="note-capture">
            <form id="captureForm">
                <textarea class="form-control mb-2" id="captureContent" rows="3" placeholder="Capture a thought..."
                    required></textarea>
                <div class="d-flex gap-2">
                    <input type="text" class="form-control form-control-sm" id="captureTags"
                        placeholder="tags, comma, separated (optional)" />
                    <button type="submit" class="btn btn-primary btn-sm text-nowrap">Save Note</button>
                </div>
            </form>
        </div>

        <div class="note-filter">
            <input type="text" class="form-control form-control-sm" id="tagFilter"
                placeholder="Filter by tag(s), comma-separated" />
            <button class="btn btn-outline-secondary btn-sm text-nowrap" id="applyFilterBtn">Filter</button>
            <button class="btn btn-outline-secondary btn-sm text-nowrap" id="clearFilterBtn">Clear</button>
        </div>

        <div id="notesList"></div>
    </main>

    <!-- Edit Note Modal -->
    <div class="modal fade" id="noteModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="editNoteForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Note</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editNoteId" />
                        <div class="mb-3">
                            <label class="form-label" for="editNoteContent">Content</label>
                            <textarea class="form-control" id="editNoteContent" rows="4" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="editNoteTags">Tags (comma-separated)</label>
                            <input type="text" class="form-control" id="editNoteTags" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                            data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Convert Note to Task Modal -->
    <div class="modal fade" id="convertNoteModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <form id="convertNoteForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Convert Note to Task</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="convertNoteId" />
                        <div class="mb-3">
                            <label class="form-label" for="convertTaskTitle">Task Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="convertTaskTitle" required placeholder="Enter a title for this task" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="convertTaskDescription">Description</label>
                            <textarea class="form-control" id="convertTaskDescription" rows="5"></textarea>
                            <div class="form-text">The full note content is used as the description. You can edit it if needed.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="convertTaskDueAt">Due Date & Time (optional)</label>
                            <input type="datetime-local" class="form-control" id="convertTaskDueAt" />
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="convertTaskUrgent" />
                                    <label class="form-check-label" for="convertTaskUrgent">Urgent</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="convertTaskImportant" />
                                    <label class="form-check-label" for="convertTaskImportant">Important</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                            data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Convert to Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/pages/notes.js"></script>
</body>

</html>
