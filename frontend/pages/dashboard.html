<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — Second Brain</title>
    <!-- Default favicon (light) — updated by pre-paint script before first paint -->
    <link id="favicon" rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <script>
        (function () {
            var pref = localStorage.getItem('theme') || 'system';
            var resolved = pref === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : pref;
            document.documentElement.setAttribute('data-theme', resolved);
            // Update favicon href before first paint to match resolved theme
            var favicon = document.getElementById('favicon');
            if (favicon) favicon.href = resolved === 'dark' ? '../favicon-dark.svg' : '../favicon.svg';
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app-nav"></div>
    <div id="profileFilterContainer"></div>

    <main class="dashboard-page">
        <div id="overdueSection"></div>

        <div class="row">
            <div class="col-md-6">
                <div class="dash-card">
                    <div class="dash-section-title">Today · Tasks</div>
                    <div id="todayTasks"></div>
                </div>
                <div class="dash-card">
                    <div class="dash-section-title">Today · Habits</div>
                    <div id="todayHabits"></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="dash-card">
                    <div class="dash-section-title">Today · Reminders</div>
                    <div id="todayReminders"></div>
                </div>
                <div class="dash-card">
                    <div class="dash-section-title">Today · Calendar Events</div>
                    <div id="todayEvents"></div>
                </div>
            </div>
        </div>

        <div class="dash-card">
            <div class="dash-section-title">Tomorrow</div>
            <div id="tomorrowItems"></div>
        </div>

        <div class="dash-card">
            <div class="dash-section-title">Next 7 Days</div>
            <div id="next7Items"></div>
        </div>

        <div class="dash-card">
            <div class="dash-section-title">No Deadline</div>
            <div id="noDeadlineTasks"></div>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/pages/dashboard.js"></script>
    <script>
        // Watch for system theme changes and update favicon when theme is 'system'
        (function () {
            var pref = localStorage.getItem('theme') || 'system';
            var favicon = document.getElementById('favicon');

            function updateFavicon() {
                var resolved = pref === 'system'
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : pref;
                if (favicon) favicon.href = resolved === 'dark' ? '../favicon-dark.svg' : '../favicon.svg';
            }

            // Listen for OS theme changes
            if (window.matchMedia) {
                var mq = window.matchMedia('(prefers-color-scheme: dark)');
                if (mq.addEventListener) {
                    mq.addEventListener('change', function () {
                        if (pref === 'system') updateFavicon();
                    });
                }
            }

            // Listen for storage changes (theme changed in another tab)
            window.addEventListener('storage', function (e) {
                if (e.key === 'theme') {
                    pref = e.newValue || 'system';
                    updateFavicon();
                }
            });
        })();
    </script>
</body>

</html>
