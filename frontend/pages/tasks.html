<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks - Second Brain</title>
    <script>
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app-nav"></div>

    <main class="tasks-page">
        <div class="tasks-toolbar">
            <h1 class="h4 mb-0">Tasks</h1>
            <button class="btn btn-primary btn-sm" id="addTaskBtn">+ Add Task</button>
        </div>

        <div class="matrix-grid">
            <div class="quadrant q-do-first">
                <div class="quadrant-title">Do First</div>
                <div class="quadrant-subtitle">Urgent &amp; Important</div>
                <div id="quadrant-do-first"></div>
            </div>
            <div class="quadrant q-schedule">
                <div class="quadrant-title">Schedule</div>
                <div class="quadrant-subtitle">Important, Not Urgent</div>
                <div id="quadrant-schedule"></div>
            </div>
            <div class="quadrant q-delegate">
                <div class="quadrant-title">Delegate</div>
                <div class="quadrant-subtitle">Urgent, Not Important</div>
                <div id="quadrant-delegate"></div>
            </div>
            <div class="quadrant q-eliminate">
                <div class="quadrant-title">Eliminate</div>
                <div class="quadrant-subtitle">Not Urgent, Not Important</div>
                <div id="quadrant-eliminate"></div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Task Modal -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="taskForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="taskModalTitle">Add Task</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="taskId" />
                        <div class="mb-3">
                            <label class="form-label" for="taskTitle">Title</label>
                            <input type="text" class="form-control" id="taskTitle" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="taskDescription">Description</label>
                            <textarea class="form-control" id="taskDescription" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="taskDueAt">Due date/time (optional)</label>
                            <input type="datetime-local" class="form-control" id="taskDueAt" />
                            <div class="form-text">Interpreted in your browser's local timezone.</div>
                        </div>
                        <div class="d-flex gap-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="taskUrgent" />
                                <label class="form-check-label" for="taskUrgent">Urgent</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="taskImportant" />
                                <label class="form-check-label" for="taskImportant">Important</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                            data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- View Task Modal (read-only) -->
    <div class="modal fade" id="viewTaskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Task Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Title</label>
                        <div id="viewTaskTitle" class="form-control-plaintext"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Description</label>
                        <div id="viewTaskDescription" class="form-control-plaintext"
                            style="white-space: pre-wrap; min-height: 60px;"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Due Date</label>
                        <div id="viewTaskDueAt" class="form-control-plaintext"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Status</label>
                        <div id="viewTaskStatus" class="form-control-plaintext"></div>
                    </div>
                    <div class="d-flex gap-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="viewTaskUrgent" disabled />
                            <label class="form-check-label" for="viewTaskUrgent">Urgent</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="viewTaskImportant" disabled />
                            <label class="form-check-label" for="viewTaskImportant">Important</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary btn-sm"
                        data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary btn-sm" id="viewTaskEditBtn">Edit</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/pages/tasks.js"></script>
</body>

</html>
