<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks — Second Brain</title>
    <script>
        (function () {
            var pref = localStorage.getItem('theme') || 'system';
            var resolved = pref === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : pref;
            document.documentElement.setAttribute('data-theme', resolved);
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app-nav"></div>

    <main class="tasks-page">
        <div class="tasks-toolbar">
            <h1 class="h4 mb-0">Tasks</h1>
            <button class="btn btn-primary btn-sm" id="addTaskBtn">+ Add Task</button>
        </div>

        <div class="matrix-grid">
            <div class="quadrant q-do-first">
                <div class="quadrant-title">Do First</div>
                <div class="quadrant-subtitle">Urgent &amp; Important</div>
                <div id="quadrant-do-first"></div>
            </div>
            <div class="quadrant q-schedule">
                <div class="quadrant-title">Schedule</div>
                <div class="quadrant-subtitle">Important, Not Urgent</div>
                <div id="quadrant-schedule"></div>
            </div>
            <div class="quadrant q-delegate">
                <div class="quadrant-title">Delegate</div>
                <div class="quadrant-subtitle">Urgent, Not Important</div>
                <div id="quadrant-delegate"></div>
            </div>
            <div class="quadrant q-eliminate">
                <div class="quadrant-title">Eliminate</div>
                <div class="quadrant-subtitle">Not Urgent, Not Important</div>
                <div id="quadrant-eliminate"></div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Task Modal -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="taskForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="taskModalTitle">Add Task</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="taskId" />
                        <div class="mb-3">
                            <label class="form-label" for="taskTitle">Title</label>
                            <input type="text" class="form-control" id="taskTitle" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="taskDescription">Description</label>
                            <textarea class="form-control" id="taskDescription" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="taskDueAt">Due date/time (optional)</label>
                            <input type="datetime-local" class="form-control" id="taskDueAt" />
                            <div class="form-text">Interpreted in your browser's local timezone.</div>
                        </div>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="taskUrgent" />
                                <label class="form-check-label" for="taskUrgent">Urgent</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="taskImportant" />
                                <label class="form-check-label" for="taskImportant">Important</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                            data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/pages/tasks.js"></script>
</body>

</html>
