<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar - Second Brain</title>
    <script>
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app-nav"></div>

    <main class="calendar-page">
        <div class="cal-nav">
            <button class="btn btn-outline-secondary btn-sm" id="prevBtn">&larr;</button>
            <div class="cal-month-label" id="periodLabel"></div>
            <button class="btn btn-outline-secondary btn-sm" id="nextBtn">&rarr;</button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="btn-group btn-group-sm" role="group">
                <button class="btn btn-outline-secondary view-btn active" data-view="month">Month</button>
                <button class="btn btn-outline-secondary view-btn" data-view="week">Week</button>
                <button class="btn btn-outline-secondary view-btn" data-view="day">Day</button>
            </div>
            <button class="btn btn-primary btn-sm" id="addEventBtn">+ Add Event</button>
        </div>

        <div class="cal-grid" id="calGrid"></div>

        <div class="cal-day-panel" id="dayPanel">
            <div class="dash-empty">Click a day to see its items.</div>
        </div>
    </main>

    <div class="modal fade" id="eventModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="eventForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Calendar Event</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="eventTitle">Title</label>
                            <input type="text" class="form-control" id="eventTitle" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="eventStartsAt">Starts at</label>
                            <input type="datetime-local" class="form-control" id="eventStartsAt" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="eventEndsAt">Ends at (optional)</label>
                            <input type="datetime-local" class="form-control" id="eventEndsAt" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="eventLocation">Location (optional)</label>
                            <input type="text" class="form-control" id="eventLocation" />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                            data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/pages/calendar.js"></script>
</body>

</html>
