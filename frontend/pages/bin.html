<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bin — Second Brain</title>
    <!-- Default favicon (light) — updated by pre-paint script before first paint -->
    <link id="favicon" rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <script>
        (function () {
            var pref = localStorage.getItem('theme') || 'system';
            var resolved = pref === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : pref;
            document.documentElement.setAttribute('data-theme', resolved);
            var design = localStorage.getItem('design_system') || 'signal';
            document.documentElement.setAttribute('data-design', design);
            // Update favicon href before first paint to match resolved theme
            var favicon = document.getElementById('favicon');
            if (favicon) favicon.href = resolved === 'dark' ? '../favicon-dark.svg' : '../favicon.svg';
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/app.css" rel="stylesheet" />
    <link href="../css/neo.css" rel="stylesheet" />
</head>

<body>
    <div id="app-nav"></div>
    <div id="profileFilterContainer"></div>

    <main class="bin-page">
        <h1 class="h4 mb-3">Bin</h1>
        <p class="text-muted small mb-3">Items are permanently deleted 30 days after being moved here.</p>
        <div id="binList"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/pages/bin.js"></script>
</body>

</html>
