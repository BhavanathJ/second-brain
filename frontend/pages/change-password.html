<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password - Second Brain</title>
    <script>
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app-nav"></div>

    <main class="settings-page">
        <div class="d-flex align-items-center gap-2 mb-3">
            <a href="settings.html" class="btn btn-outline-secondary btn-sm">&larr; Back to Settings</a>
            <h1 class="h4 mb-0">Change Password</h1>
        </div>

        <div class="settings-card">
            <form id="changePasswordForm">
                <div class="mb-3">
                    <label class="form-label" for="currentPassword">Current password</label>
                    <input type="password" class="form-control" id="currentPassword" required
                        autocomplete="current-password" />
                </div>
                <div class="mb-3">
                    <label class="form-label" for="newPassword">New password</label>
                    <input type="password" class="form-control" id="newPassword" required minlength="8"
                        autocomplete="new-password" />
                    <div class="form-text">At least 8 characters.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmNewPassword">Confirm new password</label>
                    <input type="password" class="form-control" id="confirmNewPassword" required
                        autocomplete="new-password" />
                </div>
                <button type="submit" class="btn btn-outline-danger btn-sm">Change Password</button>
                <div class="form-text mt-2">This will log you out of all devices and profiles - you'll need to log in
                    again with the new password.</div>
            </form>
        </div>
    </main>

    <script type="module" src="../js/pages/change-password.js"></script>
</body>

</html>
